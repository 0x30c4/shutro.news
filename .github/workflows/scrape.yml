name: scrape-and-deploy

on:
  schedule:
    - cron: '*/30 * * * *'   # প্রতি ৩০ মিনিটে (ব্যস্ত সময়ে ৫–১৫ মিনিট দেরি হতে পারে)
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write   # data ব্রাঞ্চে DB পুশ

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore database from data branch
        run: |
          if git fetch origin data --depth=1 2>/dev/null; then
            git show origin/data:shutro.db > server/shutro.db
            echo "db restored"
          else
            echo "fresh db"
          fi

      - name: Run pipeline and export static site
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INGEST_MODE: mixed
        run: node server/export.js

      - name: Persist database to data branch
        run: |
          set -e
          DIR=$(mktemp -d)
          cp server/shutro.db "$DIR/"
          cd "$DIR"
          git init -q -b data
          git config user.name shutro-bot
          git config user.email actions@users.noreply.github.com
          git add shutro.db
          git commit -qm "data $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name shutro-news --branch main
